---
- name: Bootstrap Kubernetes control plane
  hosts: control_plane
  become: true

  tasks:
    - name: Check whether Kubernetes is already initialized
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: kubernetes_initialized

    - name: Initialize Kubernetes control plane
      ansible.builtin.command:
        cmd: >
          kubeadm init
          --apiserver-advertise-address={{ control_plane_ip }}
          --pod-network-cidr={{ pod_network_cidr }}
      when: not kubernetes_initialized.stat.exists
      register: kubeadm_init

    - name: Create kubeconfig directory for ubuntu
      ansible.builtin.file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copy Kubernetes admin config
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ubuntu/.kube/config
        remote_src: true
        owner: ubuntu
        group: ubuntu
        mode: "0600"
